name: Daily Edition

on:
  schedule:
    # 07:00 UTC (PRD §12 proposed schedule): the edition, briefing email and
    # reels land for the London morning and are ready well before the US day.
    # GitHub cron is fixed UTC and ignores DST.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate the edition but do NOT publish, email, or post"
        type: boolean
        default: false
      max_stories:
        description: "Story cap, 1-3. Default 3, same as a normal run."
        type: string
        default: "3"
      site_only:
        description: "Site only: skip Meta reels and the subscriber email. Ops email still sends unless dry_run."
        type: boolean
        default: false
      triage_provider:
        description: "claude (default) or jev. Jev ranks with Noul and Score, then Claude writes. Any Jev error falls back to Claude."
        type: choice
        options:
          - claude
          - jev
        default: claude

jobs:
  publish-edition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 matches @typesafe-ai/sdk. The cron above is unchanged.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      # Remotion renders via headless Chromium, which on CI may need extra
      # system libraries that ubuntu-latest does not ship by default. If the
      # render step fails on the first run, add the Remotion-recommended apt
      # dependencies step here (see Remotion docs: "Render on GitHub Actions").
      # Do NOT add that step pre-emptively.
      - run: npx tsx scripts/publish-edition.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPS_EMAIL: ${{ secrets.OPS_EMAIL }}
          # Empty on a schedule run. The script treats anything other than
          # 1/true as off, so a scheduled run keeps the historical path.
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_STORIES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_stories || (github.event_name != 'workflow_dispatch' && vars.MAX_STORIES) || '3' }}
          SITE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.site_only || (github.event_name != 'workflow_dispatch' && vars.SITE_ONLY) || 'false' }}
          SKIP_REELS: ${{ vars.SKIP_REELS }}
          SKIP_SUBSCRIBER_EMAIL: ${{ vars.SKIP_SUBSCRIBER_EMAIL }}
          TRIAGE_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.triage_provider || (github.event_name != 'workflow_dispatch' && vars.TRIAGE_PROVIDER) || 'claude' }}
          JEV_NOUL_THRESHOLD: ${{ vars.JEV_NOUL_THRESHOLD || '0.55' }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
