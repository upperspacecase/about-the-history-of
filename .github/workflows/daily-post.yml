name: Daily Reels

on:
  schedule:
    # 12:00 UTC. The pipeline takes ~10-25 min to go live, so content publishes
    # ~8:15am ET — fresh for New York's morning and the larger US Instagram
    # audience — and ~1:15pm London. GitHub cron is fixed UTC and ignores DST:
    # in winter this lands ~7:15am ET / ~12:15pm London. To optimise for the
    # London morning + digest email instead, use 07:30 UTC (~8:45am London).
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render + upload reels but do NOT post to Instagram or send email"
        type: boolean
        default: false

jobs:
  daily-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      # Remotion renders via headless Chromium, which on CI may need extra
      # system libraries that ubuntu-latest does not ship by default. If the
      # render step fails on the first run, add the Remotion-recommended apt
      # dependencies step here (see Remotion docs: "Render on GitHub Actions").
      # Do NOT add that step pre-emptively.
      - run: npx tsx scripts/daily-post.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPS_EMAIL: ${{ secrets.OPS_EMAIL }}
          DRY_RUN: ${{ inputs.dry_run }}
